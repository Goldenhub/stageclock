<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#09090b" />
  <title>StageClock Remote</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #71717a;
      --green: #059669;
      --amber: #fbbf24;
      --red: #ef4444;
      --indigo: #6366f1;
      --btn-h: 68px;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* PIN screen */
    #pin-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
    }

    #pin-screen h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    #pin-screen p {
      color: var(--muted);
      font-size: 0.875rem;
    }

    #pin-input {
      font-size: 2rem;
      letter-spacing: 0.5em;
      text-align: center;
      width: 12ch;
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      outline: none;
    }

    #pin-input:focus {
      border-color: var(--indigo);
    }

    #pin-error {
      color: var(--red);
      font-size: 0.875rem;
      min-height: 1.25em;
    }

    #pin-btn {
      width: 100%;
      padding: 18px;
      background: var(--indigo);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    #pin-btn:active {
      opacity: 0.8;
    }

    /* Main remote */
    #remote {
      flex: 1;
      display: none;
      flex-direction: column;
    }

    /* Status bar */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }

    #conn-dot.ok {
      background: var(--green);
    }

    #conn-label {
      color: var(--muted);
    }

    #app-title {
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    /* Timer display */
    #timer-section {
      background: var(--surface);
      padding: 24px 16px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    #item-label {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 8px;
      min-height: 1.25em;
      letter-spacing: 0.05em;
    }

    #timer-clock {
      font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-size: 24vw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    #timer-clock.warning {
      color: var(--amber);
    }

    #timer-clock.critical {
      color: var(--red);
      animation: flash 1s ease-in-out infinite;
    }

    #timer-clock.overtime {
      color: var(--red);
      animation: flash 1s ease-in-out infinite;
    }

    @keyframes flash {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }

    #timer-status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Controls */
    #controls {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .btn-row {
      display: grid;
      gap: 8px;
    }

    .cols-2 {
      grid-template-columns: 1fr 1fr;
    }

    .btn-row.cols-1 {
      grid-template-columns: 1fr;
    }

    .btn-row.cols-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .cols-4 {
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }

    .ctrl {
      height: var(--btn-h);
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.1s, transform 0.1s;
    }

    .ctrl:active {
      opacity: 0.75;
      transform: scale(0.97);
    }

    .ctrl-green {
      background: var(--green);
      color: white;
    }

    .ctrl-amber {
      background: var(--amber);
      color: black;
    }

    .ctrl-gray {
      background: #27272a;
      color: var(--text);
      border: 1px solid #3f3f46;
    }

    .ctrl.ctrl-plus {
      color: #6ee7b7;
    }

    .ctrl-dark {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      height: 54px;
    }

    /* Schedule */
    #schedule-section {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: none;
    }

    #schedule-section h3 {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .sched-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .sched-item:active {
      border-color: var(--indigo);
    }

    .sched-item.active {
      border-color: var(--indigo);
      background: #1e1b4b;
    }

    .sched-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .sched-dur {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Banner section */
    #banner-section {
      border-top: 1px solid var(--border);
      padding: 12px;
    }

    #banner-section h3 {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    #banner-presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .banner-preset {
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-preset:active {
      border-color: var(--indigo);
      background: #1e1b4b;
    }

    .banner-preset.active-preset {
      border-color: var(--amber);
      background: #422006;
      color: var(--amber);
    }

    #banner-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    #banner-input {
      flex: 1;
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 0 14px;
      font-size: 0.9rem;
      outline: none;
    }

    #banner-input:focus {
      border-color: var(--indigo);
    }

    #banner-send {
      height: 44px;
      padding: 0 18px;
      background: var(--indigo);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    #banner-send:active {
      opacity: 0.75;
    }

    #banner-clear {
      width: 100%;
      height: 38px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
    }

    #banner-clear:active {
      opacity: 0.75;
    }

    .tap-flash {
      animation: tapFlash 0.15s ease-out both;
    }

    @keyframes tapFlash {
      0% {
        opacity: 0.6;
        transform: scale(0.95);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <div id="pin-screen">
    <h1>&#9201; StageClock</h1>
    <p>Enter the PIN to connect</p>
    <input id="pin-input" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="· · · ·" autocomplete="off" />
    <div id="pin-error"></div>
    <button id="pin-btn">Connect</button>
  </div>

  <div id="remote">
    <div id="status-bar">
      <div class="status-left">
        <div id="conn-dot"></div>
        <span id="conn-label">Connecting…</span>
      </div>
      <span id="app-title"><img src="/logo" alt="StageClock" style="height:18px; vertical-align:middle;" /> STAGECLOCK</span>
      <span style="width:70px"></span>
    </div>

    <div id="timer-section">
      <div id="item-label"></div>
      <div id="timer-clock">00:00</div>
      <div id="timer-status">Stopped</div>
    </div>

    <div id="controls">
      <div class="btn-row cols-1">
        <button class="ctrl ctrl-green" id="btn-start">&#9654; Start</button>
        <button class="ctrl ctrl-amber" id="btn-pause" style="display:none">&#9646;&#9646; Pause</button>
      </div>
      <div class="btn-row cols-2">
        <button class="ctrl ctrl-gray" id="btn-stop">&#9632; Stop</button>
        <button class="ctrl ctrl-gray" id="btn-reset">&#8635; Reset</button>
      </div>
      <div class="btn-row cols-3">
        <button class="ctrl ctrl-dark" id="btn-m10">&#8722;10 min</button>
        <button class="ctrl ctrl-dark" id="btn-m5">&#8722;5 min</button>
        <button class="ctrl ctrl-dark" id="btn-m1">&#8722;1 min</button>
      </div>
      <div class="btn-row cols-3">
        <button class="ctrl ctrl-dark ctrl-plus" id="btn-p1">+1 min</button>
        <button class="ctrl ctrl-dark ctrl-plus" id="btn-p5">+5 min</button>
        <button class="ctrl ctrl-dark ctrl-plus" id="btn-p10">+10 min</button>
      </div>
      <div id="schedule-section">
        <h3 id="schedule-heading">Schedule — tap to load</h3>
        <div id="schedule-items"></div>
      </div>
      <div id="banner-section">
        <h3>Message to speaker</h3>
        <div id="banner-presets">
          <button class="banner-preset" data-text="Speaker ready">Speaker ready</button>
          <button class="banner-preset" data-text="5 minutes left">5 minutes left</button>
          <button class="banner-preset" data-text="Wrap it up">Wrap it up</button>
        </div>
        <div id="banner-row">
          <input id="banner-input" type="text" placeholder="Type a message…" autocomplete="off" />
          <button id="banner-send">Send</button>
        </div>
        <button id="banner-clear">Clear message</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var PIN_KEY = 'et_pin';
      var ws = null;
      var reconnectDelay = 1000;
      var currentPin = '';

      // ── helpers ────────────────────────────────────────────────────────────────
      function $(id) { return document.getElementById(id); }

      function haptic(el) {
        if (!el) return;
        el.classList.add('tap-flash');
        setTimeout(function () { el.classList.remove('tap-flash'); }, 150);
      }

      function setStatus(ok, label) {
        $('conn-dot').className = ok ? 'ok' : '';
        $('conn-label').textContent = label;
      }

      // Countdowns round up so the clock reaches 00:00 exactly when time runs out.
      function fmtMs(ms, roundUp) {
        var abs = Math.abs(ms) / 1000;
        var totalSec = roundUp ? Math.ceil(abs) : Math.floor(abs);
        var h = Math.floor(totalSec / 3600);
        var m = Math.floor((totalSec % 3600) / 60);
        var s = totalSec % 60;
        var sign = ms < 0 ? '+' : '';
        var ss = String(s).padStart(2, '0');
        if (h > 0) return sign + h + ':' + String(m).padStart(2, '0') + ':' + ss;
        return sign + String(m).padStart(2, '0') + ':' + ss;
      }

      function fmtSec(sec) {
        var m = Math.floor(sec / 60), s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function escHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // ── send ───────────────────────────────────────────────────────────────────
      function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(obj));
        }
      }

      // ── PIN screen ─────────────────────────────────────────────────────────────
      function submitPin() {
        haptic($('pin-btn'));
        var pin = $('pin-input').value.trim();
        if (!pin) return;
        currentPin = pin;
        sessionStorage.setItem(PIN_KEY, pin);
        $('pin-error').textContent = '';
        showRemote();
        connect(pin);
      }

      function showRemote() {
        $('pin-screen').style.display = 'none';
        $('remote').style.display = 'flex';
      }

      $('pin-btn').addEventListener('click', submitPin);
      $('pin-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submitPin();
      });

      // ── WebSocket ──────────────────────────────────────────────────────────────
      function connect(pin) {
        // Use the page's own host:port — the server may not be on 3000.
        var url = 'ws://' + window.location.host + '/ws';
        try { ws = new WebSocket(url); } catch (e) { scheduleReconnect(pin); return; }

        ws.onopen = function () {
          reconnectDelay = 1000;
          setStatus(true, 'Connected');
          ws.send(JSON.stringify({ type: 'AUTH', pin: pin }));
        };

        ws.onclose = function () {
          setStatus(false, 'Reconnecting…');
          scheduleReconnect(pin);
        };

        ws.onerror = function () {
          setStatus(false, 'Connection error');
        };

        ws.onmessage = function (event) {
          try {
            var msg = JSON.parse(event.data);
            switch (msg.type) {
              case 'AUTH_OK':
                setStatus(true, 'Connected ✓');
                break;
              case 'AUTH_FAIL':
                sessionStorage.removeItem(PIN_KEY);
                $('pin-error').textContent = 'Incorrect PIN.';
                $('remote').style.display = 'none';
                $('pin-screen').style.display = 'flex';
                break;
              case 'STATE':
                updateDisplay(msg);
                break;
              case 'SCHEDULE':
                renderSchedule(msg.name || '', msg.items || [], msg.active_item_id);
                break;
            }
          } catch (_) { }
        };
      }

      function scheduleReconnect(pin) {
        setTimeout(function () {
          reconnectDelay = Math.min(reconnectDelay * 1.5, 5000);
          connect(pin);
        }, reconnectDelay);
      }

      // ── Display update ─────────────────────────────────────────────────────────
      // The server sends state when something changes (and once a second).
      // Between messages the clock is advanced locally so it ticks smoothly.
      var lastState = null;
      var lastStateAt = 0;

      function currentElapsed() {
        if (!lastState) return 0;
        if (!lastState.running) return lastState.elapsed_ms;
        var dt = performance.now() - lastStateAt;
        return lastState.direction === 'down'
          ? lastState.elapsed_ms - dt
          : lastState.elapsed_ms + dt;
      }

      function renderClock() {
        if (!lastState) return;
        var state = lastState;
        var clock = $('timer-clock');
        var elapsed = currentElapsed();
        var isDown = state.direction === 'down';
        var isOver = isDown && elapsed < 0;

        if (isOver && !state.allow_overtime) {
          clock.textContent = "TIME'S UP";
          clock.className = 'critical';
        } else if (isOver) {
          clock.textContent = fmtMs(elapsed, false);
          clock.className = 'overtime';
        } else {
          clock.textContent = fmtMs(elapsed, isDown && elapsed > 0);
          clock.className = '';
          if (isDown && state.duration_ms > 0) {
            var rem = elapsed / 1000;
            var critical = state.critical_seconds != null ? state.critical_seconds : 30;
            var warning = state.warning_seconds != null ? state.warning_seconds : 120;
            if (rem <= critical) clock.classList.add('critical');
            else if (rem <= warning) clock.classList.add('warning');
          }
        }
      }

      setInterval(renderClock, 100);

      function updateDisplay(state) {
        lastState = state;
        lastStateAt = performance.now();
        renderClock();

        // Reflect the banner that is actually on the stage.
        document.querySelectorAll('.banner-preset').forEach(function (b) {
          b.classList.toggle('active-preset', !!state.banner_text && b.getAttribute('data-text') === state.banner_text);
        });

        $('item-label').textContent = state.label || '';
        $('timer-status').textContent =
          state.running ? '● Running' : '◼ Stopped';

        $('btn-start').style.display = state.running ? 'none' : '';
        $('btn-pause').style.display = state.running ? '' : 'none';
      }

      function renderSchedule(name, items, activeItemId) {
        var section = $('schedule-section');
        var container = $('schedule-items');
        var heading = $('schedule-heading');
        if (!items.length) { section.style.display = 'none'; return; }
        section.style.display = 'block';
        heading.textContent = name ? 'Schedule — ' + name : 'Schedule — tap to load';
        container.innerHTML = '';
        items.forEach(function (item) {
          var el = document.createElement('div');
          el.className = 'sched-item' + (item.id === activeItemId ? ' active' : '');
          el.innerHTML =
            '<span class="sched-name">' + escHtml(item.label) + '</span>' +
            '<span class="sched-dur">' + fmtSec(item.duration_seconds || 0) + '</span>';
          el.addEventListener('click', function () {
            haptic(el);
            // Loading replaces what's on stage — confirm if a timer is running.
            if (lastState && lastState.running &&
                !window.confirm('"' + (lastState.label || 'The current timer') + '" is running.\n\nReplace it with "' + item.label + '"?')) {
              return;
            }
            send({ type: 'LOAD_ITEM', id: item.id, duration: item.duration_seconds, label: item.label, direction: item.direction || 'down' });
          });
          container.appendChild(el);
        });
      }

      // ── Control button wiring ─────────────────────────────────────────────────
      $('btn-start').addEventListener('click', function () { haptic(this); send({ type: 'START' }); });
      $('btn-pause').addEventListener('click', function () { haptic(this); send({ type: 'PAUSE' }); });
      $('btn-stop').addEventListener('click', function () { haptic(this); send({ type: 'STOP' }); });
      $('btn-reset').addEventListener('click', function () { haptic(this); send({ type: 'RESET' }); });
      $('btn-m10').addEventListener('click', function () { haptic(this); send({ type: 'ADJUST', delta: -600 }); });
      $('btn-m5').addEventListener('click', function () { haptic(this); send({ type: 'ADJUST', delta: -300 }); });
      $('btn-m1').addEventListener('click', function () { haptic(this); send({ type: 'ADJUST', delta: -60 }); });
      $('btn-p1').addEventListener('click', function () { haptic(this); send({ type: 'ADJUST', delta: 60 }); });
      $('btn-p5').addEventListener('click', function () { haptic(this); send({ type: 'ADJUST', delta: 300 }); });
      $('btn-p10').addEventListener('click', function () { haptic(this); send({ type: 'ADJUST', delta: 600 }); });

      // ── Auto-connect if PIN saved ─────────────────────────────────────────────
      var savedPin = sessionStorage.getItem(PIN_KEY);
      if (savedPin) {
        currentPin = savedPin;
        showRemote();
        connect(savedPin);
      }

      // ── Banner ────────────────────────────────────────────────────────────────
      // The server clears banners after BANNER_SECONDS, so a phone that locks
      // or loses Wi-Fi can't leave a banner stuck on the stage.
      var BANNER_SECONDS = 30;

      function setBanner(text) {
        send({ type: 'SET_BANNER', text: text || null, duration: BANNER_SECONDS });
      }

      document.querySelectorAll('.banner-preset').forEach(function (btn) {
        btn.addEventListener('click', function () {
          haptic(btn);
          var text = btn.getAttribute('data-text');
          var isActive = btn.classList.contains('active-preset');
          setBanner(isActive ? null : text);
          if (!isActive) $('banner-input').value = '';
        });
      });

      function sendCustomBanner() {
        var text = $('banner-input').value.trim();
        if (!text) return;
        setBanner(text);
      }

      $('banner-send').addEventListener('click', function () {
        haptic(this);
        sendCustomBanner();
      });

      $('banner-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          haptic($('banner-send'));
          sendCustomBanner();
        }
      });

      $('banner-clear').addEventListener('click', function () {
        haptic(this);
        setBanner(null);
        $('banner-input').value = '';
      });
    })();
  </script>
</body>

</html>
